<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4E78"><title>Instrument Calibration Tracker</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231F4E78'/%3E%3Cpath d='M32 32L48 18' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667;--pri:#1F4E78;--bd:#dde3ea;--red:#c62828;--amb:#e08a00;--grn:#2e7d32;--blu:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c232c;--tx:#e8edf2;--mut:#9aa6b2;--bd:#2d3844;--pri:#5b9bd5}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.4 system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#1F4E78;color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:140px}header small{opacity:.85}header button{background:#ffffff26;color:#fff;border:0;padding:7px 10px;border-radius:6px;font:inherit}
header #blo{background:#c62828;font-weight:600}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto}nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:20px;white-space:nowrap;font:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 10px 100px;max-width:1150px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:10px;padding:12px;cursor:pointer}
.card b{font-size:28px;display:block}.card span{color:var(--mut);font-size:12px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;justify-content:space-between;cursor:pointer}
.row small,small{color:var(--mut)}.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap;height:fit-content}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:end}.bar>*{flex:1;min-width:130px}.bar>.btn{flex:0 0 auto}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}
dialog{border:0;border-radius:12px;padding:16px;width:min(580px,96vw);background:var(--card);color:var(--tx);max-height:92vh;overflow:auto}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0}.chk label{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:13px}td,th{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--pri);color:#fff;position:sticky;top:0}.sc{overflow:auto;max-height:70vh}
#toast{position:fixed;inset:auto auto 84px 50%;margin:0;transform:translateX(-50%);border:0;background:#222;color:#fff;padding:9px 18px;border-radius:20px;max-width:90vw;font:inherit}
.login{max-width:360px;margin:40px auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.ph{display:none}.sw{border:1px solid var(--bd);border-radius:14px;padding:3px 10px;color:#fff;font-size:12px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.ph{display:block;margin:6px 0}.sc{max-height:none;overflow:visible}th{background:#ddd!important;color:#000;position:static}table{font-size:10px}}

header{background:linear-gradient(135deg,#17406a,#2b7bb9)!important;box-shadow:0 2px 8px #0003}
header small{color:#fff!important}.logo{width:30px;height:30px;flex:none}header h1{font-size:15px!important;line-height:1.2}
#cd.warn{background:#c62828;padding:2px 8px;border-radius:10px;font-weight:700;animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
#busy{border:0;border-radius:16px;padding:26px 30px;text-align:center;max-width:min(380px,92vw);box-shadow:0 10px 40px #0006}#busy::backdrop{background:#0009;backdrop-filter:blur(3px)}
.spin{width:46px;height:46px;border:5px solid var(--bd);border-top-color:var(--pri);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,#17406a,#2b7bb9);color:#fff;border-radius:14px;padding:14px 18px;margin:10px 0}
.hero svg text{fill:#fff!important}.hero h2{margin:0 0 4px;font-size:18px}.hero p{margin:2px 0;opacity:.9}
.pan{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.pan h4{margin:0 0 8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.ch svg{width:100%;height:auto}
.card b{font-size:30px}.card .ic{float:right;font-size:22px;opacity:.85}
.login{margin-top:50px!important;box-shadow:0 8px 30px #0002;text-align:center}.login label,.login input{text-align:left}
.pw{-webkit-text-security:disc;text-security:disc}.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--bd);margin-right:4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2e7d32;margin-right:5px;box-shadow:0 0 0 3px #2e7d3233}header select{width:auto;padding:5px 6px;border-radius:6px;background:#ffffff26;color:#fff;border:0;font:inherit}header select option{color:#000}#hclk{font-variant-numeric:tabular-nums;white-space:nowrap}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--tx);border-top:1px solid var(--bd);display:flex;gap:12px;align-items:center;justify-content:center;padding:5px 10px;z-index:4;box-shadow:0 -2px 8px #0002}
#fdt{font-size:14px}#ftm{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
</style></head><body>

function ring(p,col){const r=52,c=2*Math.PI*r;return`<svg viewBox="0 0 130 130" width="120" height="120"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#ffffff33" stroke-width="14"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 65 65)"/><text x="65" y="64" text-anchor="middle" font-size="28" font-weight="700">${p}%</text><text x="65" y="82" text-anchor="middle" font-size="10">in calibration</text></svg>`;}
function donut(parts){const t=parts.reduce((a,p)=>a+p[1],0),r=48,c=2*Math.PI*r;let off=0;const arcs=parts.filter(p=>p[1]).map(p=>{const l=c*p[1]/(t||1),e=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="${p[2]}" stroke-width="22" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`;off+=l;return e;}).join('');return`<svg viewBox="0 0 130 130" width="140" height="140"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--bd)" stroke-width="22"/>${arcs}<text x="65" y="63" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${t}</text><text x="65" y="79" text-anchor="middle" font-size="9" fill="var(--mut)">instruments</text></svg>`;}

function dash(){const L=live(),dl=x=>days(x.due),cnt=f=>L.filter(x=>f(dl(x))).length,over=cnt(d=>d<0),pct=L.length?Math.round((L.length-over)*100/L.length):100,col=pct>=90?'#69f0ae':pct>=75?'#ffd54f':'#ff8a80';

 const IC=['⛔','⏰','📅','🗓️','🔭'],cs=BK.map(([k,l,c,f],i)=>`<div class="card" style="border-left-color:${c}" onclick="tab='list';flt.b='${k}';render()"><span class="ic">${IC[i]}</span><b>${cnt(f)}</b><span>${l}</span></div>`).join('');
 const mix=[['Overdue',over,'#c62828'],['Due within 30 days',cnt(d=>d>=0&&d<=30),'#e08a00'],['31–90 days',cnt(d=>d>30&&d<=90),'#1565c0'],['More than 90 days',cnt(d=>d>90),'#2e7d32'],['No calibration date',nod,'#78909c'],['Scrap / out of service',out,'#6a1b9a']];
 const fc=[['Overdue',over,'#c62828']];for(let i=0;i<12;i++){const d=new Date(T0.getFullYear(),T0.getMonth()+i,1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');fc.push([d.toLocaleString('en',{month:'short'}),L.filter(x=>x.due.slice(0,7)===k&&dl(x)>=0).length,i===0?'#e08a00':'#1F4E78']);}
 const att=L.filter(x=>dl(x)<=7).sort((a,b)=>a.due<b.due?-1:1).slice(0,8);
 return`<div class="hero">${ring(pct,col)}<div><h2>${T(h<12?'Good morning':h<17?'Good afternoon':'Good evening')}, ${esc(S.user.name.split(' ')[0])}</h2><p>${T0.toLocaleDateString(LOC[LANG],{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><p><b>${over}</b> overdue · <b>${cnt(d=>d>=0&&d<=7)}</b> due this week · <b>${L.length}</b> tracked instruments</p></div></div>
 <div class="cards">${cs}<div class="card" style="border-left-color:#6a1b9a" onclick="tab='list';flt.s='scrapq';render()"><span class="ic">🗑️</span><b>${sc}</b><span>Damaged / Aged / Scrap proposed</span></div>

function dqRows(){const seen={};D.forEach(x=>{if(x.uid)seen[x.uid]=(seen[x.uid]||0)+1});const r=[];
