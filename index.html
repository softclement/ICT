<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4E78"><title>Calibration Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667;--pri:#1F4E78;--bd:#dde3ea;--red:#c62828;--amb:#e08a00;--grn:#2e7d32;--blu:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c232c;--tx:#e8edf2;--mut:#9aa6b2;--bd:#2d3844;--pri:#5b9bd5}}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#1F4E78;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}header button{background:#ffffff22;color:#fff;border:0;padding:6px 10px;border-radius:6px}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto}nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:20px;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 10px 80px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:10px;padding:12px;cursor:pointer}
.card b{font-size:28px;display:block}.card span{color:var(--mut);font-size:12px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;justify-content:space-between;cursor:pointer}
.row small{color:var(--mut)}.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap;height:fit-content}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bar>*{flex:1;min-width:130px}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}
dialog{border:0;border-radius:12px;padding:16px;width:min(560px,96vw);background:var(--card);color:var(--tx)}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:fixed;right:16px;bottom:16px;border-radius:50%;width:54px;height:54px;font-size:26px;box-shadow:0 3px 10px #0005}
table{border-collapse:collapse;width:100%;background:var(--card)}td,th{border:1px solid var(--bd);padding:6px;text-align:left}.sc{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none}
</style></head><body>

const nd=x=>Math.round((x-T0)/864e5);
const LIM={week:7-((T0.getDay()+6)%7)-1,month:nd(eom(0)),quarter:nd(eom((2-T0.getMonth()%3))),six:Math.round((new Date(T0.getFullYear(),T0.getMonth()+6,T0.getDate())-T0)/864e5)};
const BK=[['overdue','Overdue','var(--red)',d=>d<0],['week','Due this week','var(--amb)',d=>d>=0&&d<=LIM.week],['month','Due this month','#b8860b',d=>d>=0&&d<=LIM.month],['quarter','Due this quarter','var(--blu)',d=>d>=0&&d<=LIM.quarter],['six','Next 6 months','var(--grn)',d=>d>=0&&d<=LIM.six]];
function st(x){if(!LIVE.includes(x.status))return[x.status,'#6a1b9a'];const d=days(x.due);if(d===null)return['No date','#78909c'];if(d<0)return['Overdue '+(-d)+'d','var(--red)'];if(d<=7)return['Due in '+d+'d','var(--amb)'];if(d<=30)return['Due in '+d+'d','#b8860b'];return['OK · '+d+'d','var(--grn)'];}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
async function api(o){if(!API_URL){return demo(o);}const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({key:KEY,...o})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j;}
function demo(o){const f=D.find(x=>x.id===o.id);if(o.action==='list')return{data:SEED.map(x=>({...x})),company:'Demo company'};
 if(o.action==='save'){if(!o.item.id)o.item.id='INS-'+String(D.length+1).padStart(4,'0'),D.push(o.item);else Object.assign(f,o.item);return{data:o.item};}
 if(o.action==='calibrated'){f.cal=o.cal;f.freq=+o.freq||f.freq||12;const d=new Date(o.cal+'T00:00:00');d.setMonth(d.getMonth()+f.freq);d.setDate(d.getDate()-1);f.due=d.toISOString().slice(0,10);f.status='Active';return{data:f};}
 if(o.action==='lifecycle'){f.status=o.status;f.reason=o.reason;return{data:f};}return{data:[]};}
async function load(){if(API_URL&&!KEY)return cfg();try{const j=await api({action:'list'});D=j.data;if(j.company)$('#ttl').textContent=j.company+' · Calibration';$('#mode').textContent=API_URL?'':'DEMO';render();}catch(e){toast(e.message);if(/key/i.test(e.message))cfg();}}
function cfg(){if(!API_URL){alert('Demo mode. Edit API_URL in index.html after deploying Apps Script.');return;}const k=prompt('Access key',KEY);if(k!==null){KEY=localStorage.ck=k;load();}}
function render(){$('#nav').innerHTML=[['dash','Dashboard'],['list','Instruments'],['rep','Reports']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';flt.b=flt.a='';render()">${l}</button>`).join('');
 $('#main').innerHTML=tab==='dash'?dash():tab==='list'?list():rep();}
function dash(){const live=D.filter(x=>LIVE.includes(x.status)&&x.due);const cnt=f=>live.filter(x=>f(days(x.due))).length;
 const cs=BK.map(([k,l,c,f])=>`<div class="card" style="border-left-color:${c}" onclick="tab='list';flt.b='${k}';render()"><b>${cnt(f)}</b><span>${l}</span></div>`).join('');
 const sc=D.filter(x=>['Damaged','Worn / Aged','Scrap Proposed'].includes(x.status)).length,nod=D.filter(x=>LIVE.includes(x.status)&&!x.due).length;
 const ag={};live.filter(x=>days(x.due)<=LIM.six).forEach(x=>ag[x.agency||'(no agency)']=(ag[x.agency||'(no agency)']||0)+1);
 return`<div class="cards">${cs}
 <div class="card" style="border-left-color:#6a1b9a" onclick="tab='list';flt.s='scrapq';render()"><b>${sc}</b><span>Damaged / Aged / Scrap proposed</span></div>
 <div class="card" style="border-left-color:#78909c" onclick="tab='list';flt.b='nodate';render()"><b>${nod}</b><span>No calibration date</span></div>
 <div class="card" style="border-left-color:var(--pri)" onclick="tab='list';flt={b:'',q:'',g:'',s:'',a:''};render()"><b>${D.length}</b><span>Total instruments</span></div></div>
 <h3>Due by agency (overdue + next 6 months)</h3>${Object.entries(ag).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" onclick="tab='list';flt.a='${esc(k).replace(/'/g,'')}';flt.b='six';render()"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}
 <p><small>Overdue are also counted above only in the Overdue card. Windows: week ends Sunday; month/quarter end on calendar boundary.</small></p>`;}
function filtered(){const f=BK.find(b=>b[0]===flt.b);return D.filter(x=>{const d=days(x.due);
 if(flt.b==='nodate'&&!(LIVE.includes(x.status)&&!x.due))return false;
 if(f&&!(LIVE.includes(x.status)&&x.due&&(flt.b==='six'&&flt.a?d<=LIM.six:f[3](d))))return false;
 if(flt.s==='scrapq'&&!['Damaged','Worn / Aged','Scrap Proposed'].includes(x.status))return false;
 if(flt.s&&flt.s!=='scrapq'&&x.status!==flt.s)return false;if(flt.g&&x.group!==flt.g)return false;if(flt.a&&x.agency!==flt.a)return false;
 return!flt.q||JSON.stringify(Object.values(x)).toLowerCase().includes(flt.q.toLowerCase());}).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);}
function list(){const L=filtered();return`<div class="bar"><input placeholder="Search name, UID, make, agency…" value="${esc(flt.q)}" oninput="flt.q=this.value;clearTimeout(window.tt);window.tt=setTimeout(()=>{const p=this.selectionStart;render();const i=$('.bar input');i.focus();i.setSelectionRange(p,p)},250)">
 <select onchange="flt.b=this.value;render()"><option value="">All due windows</option>${BK.map(b=>`<option value="${b[0]}" ${flt.b===b[0]?'selected':''}>${b[1]}</option>`).join('')}<option value="nodate" ${flt.b==='nodate'?'selected':''}>No date</option></select>
 <select onchange="flt.s=this.value;render()"><option value="">All lifecycle</option><option value="scrapq" ${flt.s==='scrapq'?'selected':''}>Scrap candidates</option>${LIFE.map(s=>`<option ${flt.s===s?'selected':''}>${s}</option>`).join('')}</select>
 <select onchange="flt.g=this.value;render()"><option value="">All groups</option>${[...new Set(D.map(x=>x.group))].map(s=>`<option ${flt.g===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
 <small>${L.length} shown ${flt.a?'· agency: '+esc(flt.a):''}</small>`+L.map(x=>{const[s,c]=st(x);return`<div class="row" onclick="view('${x.id}')"><div><b>${esc(x.name)}</b> <small>${esc(x.uid||x.id)}</small><br><small>${esc(x.make)} ${esc(x.model)} · ${esc(x.param)} · ${esc(x.range)}<br>Due ${fmt(x.due)} · ${esc(x.agency||'agency not set')}</small></div><span class="pill" style="background:${c}">${s}</span></div>`}).join('');}
function view(id){const x=D.find(i=>i.id===id),[s,c]=st(x);$('#dlg').innerHTML=`<h3>${esc(x.name)} <span class="pill" style="background:${c}">${s}</span></h3>
 <p><small>${esc(x.id)} · UID ${esc(x.uid||'—')} · ${esc(x.group)} · ${esc(x.dept)}</small><br>${esc(x.make)} ${esc(x.model)} · ${esc(x.param)} · LC ${esc(x.lc||'—')} · Range ${esc(x.range)}<br>
 Calibrated <b>${fmt(x.cal)}</b> → Due <b>${fmt(x.due)}</b> (every ${x.freq||'?'} months) · ${esc(x.agency||'—')}<br>Lifecycle: <b>${esc(x.status)}</b> ${esc(x.reason)}<br>${esc(x.remarks)}</p>
 <div class="bar"><button class="btn" onclick="calib('${id}')">✔ Mark calibrated</button><button class="btn alt" onclick="edit('${id}')">Edit</button><button class="btn red" onclick="life('${id}')">Damaged / Scrap…</button><button class="btn alt" onclick="$('#dlg').close()">Close</button></div>`;$('#dlg').showModal();}
function calib(id){const x=D.find(i=>i.id===id);$('#dlg').innerHTML=`<h3>Mark calibrated – ${esc(x.name)}</h3><div class="g2"><div><label>Calibration date</label><input id="c1" type="date" value="${T0.toISOString().slice(0,10)}"></div>
 <div><label>Frequency</label><select id="c2">${[[1,'Monthly'],[3,'Quarterly'],[6,'Half-yearly'],[12,'Yearly'],[24,'2 years'],[36,'3 years']].map(([m,l])=>`<option value="${m}" ${(x.freq||12)==m?'selected':''}>${l} (${m})</option>`).join('')}</select></div></div>
 <label>Agency</label><input id="c3" value="${esc(x.agency)}"><label>Certificate no.</label><input id="c4"><label>Remarks</label><input id="c5">
 <div class="bar"><button class="btn" onclick="act({action:'calibrated',id:'${id}',cal:c1.value,freq:c2.value,agency:c3.value,cert:c4.value,remarks:c5.value})">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;}
function life(id){$('#dlg').innerHTML=`<h3>Lifecycle / scrap</h3><label>Status</label><select id="l1">${LIFE.map(s=>`<option>${s}</option>`).join('')}</select><label>Reason (broken, damaged, wear &amp; tear…)</label><textarea id="l2" rows="3"></textarea>
 <div class="bar"><button class="btn" onclick="act({action:'lifecycle',id:'${id}',status:l1.value,reason:l2.value})">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;}
function edit(id){const x=id?D.find(i=>i.id===id):{group:'Instrument',dept:'',status:'Active',freq:12};const f=(k,l)=>`<div><label>${l}</label><input id="e_${k}" value="${esc(x[k])}"></div>`;
 $('#dlg').innerHTML=`<h3>${id?'Edit':'Add'} instrument</h3><div class="g2">${f('uid','UID / Code')}${f('name','Equipment name')}${f('make','Make')}${f('model','Model')}${f('param','Parameter')}${f('lc','Least count')}${f('range','Range')}${f('agency','Cal. agency')}${f('dept','Department')}${f('group','Group')}${f('freq','Frequency (months)')}<div><label>Cal date</label><input id="e_cal" type="date" value="${x.cal||''}"></div></div><label>Remarks</label><input id="e_remarks" value="${esc(x.remarks)}">
 <div class="bar"><button class="btn" onclick="saveItem('${id||''}')">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal();}
function saveItem(id){const x=id?{...D.find(i=>i.id===id)}:{status:'Active'};['uid','name','make','model','param','lc','range','agency','dept','group','freq','cal','remarks'].forEach(k=>x[k]=$('#e_'+k).value);
 if(!x.name)return toast('Name required');if(x.cal&&x.freq){const d=new Date(x.cal+'T00:00:00');d.setMonth(d.getMonth()+ +x.freq);d.setDate(d.getDate()-1);x.due=d.toISOString().slice(0,10);}act({action:'save',item:x});}
async function act(o){try{await api(o);$('#dlg').close();toast('Saved');await load();}catch(e){toast(e.message);}}
function csv(name,rows){const h=['Asset ID','UID','Name','Make','Model','Parameter','Range','Cal date','Due date','Days left','Agency','Department','Status'];
 const s=[h,...rows.map(x=>[x.id,x.uid,x.name,x.make,x.model,x.param,x.range,x.cal,x.due,days(x.due)??'',x.agency,x.dept,x.status])].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download=name+'.csv';a.click();}
function rep(){const live=D.filter(x=>LIVE.includes(x.status)&&x.due);const R=[['Overdue',()=>live.filter(x=>days(x.due)<0)],['Due this week',()=>live.filter(x=>BK[1][3](days(x.due)))],['Due this month',()=>live.filter(x=>BK[2][3](days(x.due)))],['Due this quarter',()=>live.filter(x=>BK[3][3](days(x.due)))],['Next 6 months',()=>live.filter(x=>BK[4][3](days(x.due)))],['Scrap candidates',()=>D.filter(x=>['Damaged','Worn / Aged','Scrap Proposed'].includes(x.status))],['Missing dates',()=>D.filter(x=>!x.due)],['Full register',()=>D]];
 const ag={};live.forEach(x=>{const k=x.agency||'(none)';(ag[k]=ag[k]||[]).push(x)});
 return`<h3>Download (CSV – opens in Excel)</h3>${R.map(([n,f])=>`<div class="row" onclick="csv('${n.replace(/ /g,'_')}',(${f})())"><span>${n}</span><b>${f().length} ⬇</b></div>`).join('')}
 <h3>Agency-wise send list (all upcoming &amp; overdue)</h3><div class="sc"><table><tr><th>Agency</th><th>Count</th><th>Earliest due</th></tr>${Object.entries(ag).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.length}</td><td>${fmt(v.map(x=>x.due).sort()[0])}</td></tr>`).join('')}</table></div>
 <p><button class="btn alt" onclick="print()">🖨 Print this page</button></p>`;}
load();
</script></body></html>
