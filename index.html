<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4E78"><title>Calibration Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667;--pri:#1F4E78;--bd:#dde3ea;--red:#c62828;--amb:#e08a00;--grn:#2e7d32;--blu:#1565c0}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c232c;--tx:#e8edf2;--mut:#9aa6b2;--bd:#2d3844;--pri:#5b9bd5}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.4 system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#1F4E78;color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:140px}header small{opacity:.85}header button{background:#ffffff26;color:#fff;border:0;padding:7px 10px;border-radius:6px;font:inherit}
header #blo{background:#c62828;font-weight:600}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto}nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:20px;white-space:nowrap;font:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 10px 60px;max-width:1150px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:10px;padding:12px;cursor:pointer}
.card b{font-size:28px;display:block}.card span{color:var(--mut);font-size:12px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;justify-content:space-between;cursor:pointer}
.row small,small{color:var(--mut)}.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap;height:fit-content}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:end}.bar>*{flex:1;min-width:130px}.bar>.btn{flex:0 0 auto}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}
dialog{border:0;border-radius:12px;padding:16px;width:min(580px,96vw);background:var(--card);color:var(--tx);max-height:92vh;overflow:auto}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0}.chk label{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:13px}td,th{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--pri);color:#fff;position:sticky;top:0}.sc{overflow:auto;max-height:70vh}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:99}
.login{max-width:360px;margin:40px auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.ph{display:none}.sw{border:1px solid var(--bd);border-radius:14px;padding:3px 10px;color:#fff;font-size:12px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.ph{display:block;margin:6px 0}.sc{max-height:none;overflow:visible}th{background:#ddd!important;color:#000;position:static}table{font-size:10px}}
</style></head><body>

 <div><label>Lifecycle status</label><select id="e_status">${LIFE.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Lifecycle date (auto)</label><input value="${x.sdate||''}" disabled></div></div>
 <label>Lifecycle reason (broken / damaged / wear &amp; tear…)</label><input id="e_reason" value="${esc(x.reason)}"><label>Remarks</label><input id="e_remarks" value="${esc(x.remarks)}">
 <p><small>Due date is calculated from Cal date + Frequency.</small></p><div class="bar"><button class="btn" onclick="saveItem('${id||''}')">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal();}
function saveItem(id){const x=id?{...D.find(i=>i.id===id)}:{};['uid','name','make','model','param','lc','range','agency','dept','group','freq','cal','status','reason','remarks'].forEach(k=>x[k]=$('#e_'+k).value.trim());
 if(!x.name)return toast('Equipment name is required');if(x.cal&&x.freq)x.due=addM(x.cal,x.freq);act({action:'save',item:x});}
async function act(o){try{await api(o);$('#dlg').close();toast('Saved');await boot();}catch(e){toast(e.message);}}
/* ---------- Recipients ---------- */
const CH=[['email','Email'],['sms','SMS'],['whatsapp','WhatsApp']];
function rec(){return`<div class="bar"><span><b>Alert recipients</b><br><small>Only “Active” recipients receive alerts. Department ALL = every department.</small></span><button class="btn" onclick="recEdit()">+ Add recipient</button></div>`+(X.rec||[]).map(r=>`<div class="row" onclick="recEdit(${r.row})"><div><b>${esc(r.name)}</b> <small>${esc(r.dept)}</small><br><small>${esc(r.email)} · ${esc(r.mobile)}</small><br>${(r.channels||'').split(',').filter(Boolean).map(c=>`<span class="pill" style="background:var(--pri)">${esc(c.trim())}</span>`).join(' ')||'<small>no channel</small>'}</div>
 <button class="btn ${r.active==='YES'?'':'alt'}" onclick="event.stopPropagation();recToggle(${r.row})">${r.active==='YES'?'✔ Active':'Inactive'}</button></div>`).join('');}
function recEdit(row){const r=row?X.rec.find(x=>x.row===row):{name:'',email:'',mobile:'',dept:'ALL',channels:'email',active:'YES'};const ch=(r.channels||'').toLowerCase();
 $('#dlg').innerHTML=`<h3>${row?'Edit':'Add'} recipient</h3><label>Name</label><input id="r1" value="${esc(r.name)}"><div class="g2"><div><label>Email</label><input id="r2" type="email" value="${esc(r.email)}"></div><div><label>Mobile (country code, e.g. 9198xxxxxxxx)</label><input id="r3" value="${esc(r.mobile)}"></div></div>
 <label>Department (or ALL)</label><input id="r4" value="${esc(r.dept)}"><label>Channels</label><div class="chk">${CH.map(([k,l])=>`<label><input type="checkbox" class="rc" value="${k}" ${ch.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
 <label class="chk"><span><input type="checkbox" id="r5" ${r.active==='YES'?'checked':''}> Active (send alerts)</span></label><div class="bar"><button class="btn" onclick="recSave(${row||0})">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal();}
async function recSave(row){const it={row:row||undefined,name:$('#r1').value.trim(),email:$('#r2').value.trim(),mobile:$('#r3').value.trim(),dept:$('#r4').value.trim()||'ALL',channels:[...document.querySelectorAll('.rc:checked')].map(c=>c.value).join(','),active:$('#r5').checked};
 if(!it.name)return toast('Name required');if(/email/.test(it.channels)&&!it.email)return toast('Email address needed for email channel');if(/sms|whatsapp/.test(it.channels)&&!it.mobile)return toast('Mobile number needed for SMS / WhatsApp');
 try{X.rec=(await api({action:'recipient_save',item:it})).data;$('#dlg').close();toast('Saved');render();}catch(e){toast(e.message);}}
async function recToggle(row){const r=X.rec.find(x=>x.row===row);try{X.rec=(await api({action:'recipient_save',item:{...r,active:r.active!=='YES'}})).data;render();}catch(e){toast(e.message);}}
/* ---------- Users (admin) ---------- */
function usr(){return`<div class="bar"><span><b>Users</b><br><small>Roles: admin (all), editor (instruments &amp; calibration), viewer (read &amp; reports).</small></span><button class="btn" onclick="usrEdit()">+ Add user</button></div>`+(X.usr||[]).map(u=>`<div class="row" onclick="usrEdit('${esc(u.username)}')"><div><b>${esc(u.name)}</b> <small>${esc(u.username)}</small></div><span><span class="pill" style="background:var(--pri)">${esc(u.role)}</span> <span class="pill" style="background:${u.active==='YES'?'var(--grn)':'#78909c'}">${u.active==='YES'?'active':'disabled'}</span></span></div>`).join('');}
function usrEdit(n){const u=n?X.usr.find(x=>x.username===n):{username:'',name:'',role:'viewer',active:'YES'};
 $('#dlg').innerHTML=`<h3>${n?'Edit':'Add'} user</h3><div class="g2"><div><label>Username</label><input id="u1" value="${esc(u.username)}" ${n?'disabled':''}></div><div><label>Full name</label><input id="u2" value="${esc(u.name)}"></div></div>
 <label>Role</label><select id="u3">${['viewer','editor','admin'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select><label>${n?'Reset password (leave blank to keep)':'Temporary password (8+ chars, letters &amp; numbers)'}</label><input id="u4" type="text" autocomplete="off">
 <label class="chk"><span><input type="checkbox" id="u5" ${u.active==='YES'?'checked':''}> Active</span></label><p><small>User must change a temporary/reset password at next login.</small></p><div class="bar"><button class="btn" onclick="usrSave()">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal();}
async function usrSave(){try{X.usr=(await api({action:'user_save',item:{username:$('#u1').value.trim(),name:$('#u2').value.trim(),role:$('#u3').value,password:$('#u4').value,active:$('#u5').checked}})).data;$('#dlg').close();toast('Saved');render();}catch(e){toast(e.message);}}
/* ---------- Reports engine (view + CSV + PDF + print) ---------- */
const DUE=[['id','Asset ID'],['uid','UID'],['name','Equipment'],['make','Make'],['model','Model'],['param','Parameter'],['range','Range'],['cal','Cal date','d'],['due','Due date','d'],['dl','Days left'],['agency','Agency'],['dept','Department'],['status','Status']];
const INV=[['id','Asset ID'],['group','Group'],['uid','UID / Code'],['name','Equipment'],['make','Make'],['model','Model'],['param','Parameter'],['lc','Least count'],['range','Range'],['cal','Cal date','d'],['due','Due date','d'],['freq','Freq (m)'],['agency','Agency'],['dept','Department'],['status','Lifecycle'],['reason','Reason'],['sdate','Lifecycle date','d'],['remarks','Remarks']];
const fq=['q','Search','text','*'],fag=['agency','Agency','sel','agency'];
const GI=[['uid','UID'],['name','Equipment name'],['make','Make'],['agency','Agency'],['month','Month'],['year','Year']];
const REPS={
 overdue:{t:'Overdue instruments',grp:'Due & compliance',src:()=>live().filter(x=>days(x.due)<0),cols:DUE,fl:[fq,fag],gr:[['agency','Agency'],['make','Make']]},
 week:{t:'Due this week',grp:'Due & compliance',src:()=>live().filter(x=>BK[1][3](days(x.due))),cols:DUE,fl:[fq,fag],gr:[['agency','Agency'],['make','Make']]},
 month:{t:'Due this month',grp:'Due & compliance',src:()=>live().filter(x=>BK[2][3](days(x.due))),cols:DUE,fl:[fq,fag],gr:[['agency','Agency'],['make','Make']]},
 quarter:{t:'Due this quarter',grp:'Due & compliance',src:()=>live().filter(x=>BK[3][3](days(x.due))),cols:DUE,fl:[fq,fag],gr:[['agency','Agency'],['make','Make']]},
 six:{t:'Due in next 6 months',grp:'Due & compliance',src:()=>live().filter(x=>BK[4][3](days(x.due))),cols:DUE,fl:[fq,fag],gr:[['agency','Agency'],['make','Make']]},
 scrap:{t:'Scrap candidates (damaged / aged / proposed)',grp:'Due & compliance',src:()=>D.filter(x=>SCRAP.includes(x.status)),cols:INV,fl:[fq,['status','Status','sel','status']],gr:[['status','Status'],['make','Make']]},
 nodate:{t:'Instruments without calibration date',grp:'Due & compliance',src:()=>D.filter(x=>!x.due),cols:DUE,fl:[fq],gr:[]},
 inventory:{t:'Instrument inventory',src:()=>D,cols:INV,fl:[fq,['group','Group','sel','group'],['dept','Department','sel','dept'],['make','Make','sel','make'],['param','Parameter','sel','param'],fag,['status','Lifecycle','sel','status']],gr:[['group','Group'],['dept','Department'],['make','Make'],['param','Parameter'],['agency','Agency'],['status','Lifecycle']],click:1},
 hist:{t:'Calibration history',grp:'History & audit',load:'hist',src:()=>X.hist||[],dk:'cal',sort:(a,b)=>(b.cal||'')<(a.cal||'')?-1:1,
  cols:[['cal','Cal date','d'],['due','Due date','d'],['uid','UID'],['name','Equipment'],['make','Make'],['model','Model'],['agency','Agency'],['cert','Certificate'],['by','Done by'],['remarks','Remarks'],['logged','Logged at'],['entered','Entered by']],
  fl:[['from','Cal date from','date','cal','from'],['to','Cal date to','date','cal','to'],['uid','UID code','text','uid'],['name','Equipment name','sel','name'],['make','Make','sel','make'],fag,fq],gr:GI},
 audit:{t:'Data modification history (audit trail)',grp:'History & audit',adm:1,load:'audit',src:()=>X.audit||[],dk:'time',cols:[['time','When'],['user','User'],['entity','Entity'],['id','Record'],['action','Action'],['field','Field'],['old','Old value'],['new','New value']],
  fl:[['from','From date','date','time','from'],['to','To date','date','time','to'],['user','User','sel','user'],['entity','Entity','sel','entity'],['action','Action','sel','action'],fq],gr:[['user','User'],['entity','Entity'],['action','Action'],['month','Month']]},
 login:{t:'Login history',grp:'History & audit',adm:1,load:'login',src:()=>X.login||[],dk:'time',cols:[['time','When'],['user','User'],['event','Event'],['detail','Detail']],
  fl:[['from','From date','date','time','from'],['to','To date','date','time','to'],['user','User','sel','user'],['event','Event','sel','event'],fq],gr:[['user','User'],['event','Event'],['month','Month']]}};
function core(st){const r=REPS[st.id];let rows=r.src().map(x=>({...x,dl:x.due?days(x.due):''}));
 (r.fl||[]).forEach(([k,l,t,f,op])=>{const v=st.f[k];if(!v)return;rows=rows.filter(x=>{const a=f==='*'?Object.values(x).join(' '):String(x[f]??'');return t==='sel'?a===v:t==='date'?(op==='from'?a.slice(0,10)>=v:a.slice(0,10)<=v):a.toLowerCase().includes(v.toLowerCase())})});
 const g=st.g;if(g){const gv=x=>g==='month'?String(x[r.dk]||'').slice(0,7):g==='year'?String(x[r.dk]||'').slice(0,4):String(x[g]??'');rows.forEach(x=>x._g=gv(x)||'(blank)');rows.sort((a,b)=>a._g<b._g?-1:a._g>b._g?1:0);}else if(r.sort)rows.sort(r.sort);
 const cols=g?[['_g',(r.gr.find(a=>a[0]===g)||[0,'Group'])[1]],...r.cols]:r.cols;return{r,rows,cols,g};}
function rep(){if(ST.rs)return repView('rs');const gs={};Object.entries(REPS).forEach(([k,r])=>{if(!r.grp||(r.adm&&!admin()))return;(gs[r.grp]=gs[r.grp]||[]).push([k,r.t]);});
 return Object.entries(gs).map(([g,a])=>`<h3>${g}</h3><div class="cards">${a.map(([k,t])=>`<div class="card" onclick="openRep('${k}')"><span>${esc(t)}</span></div>`).join('')}</div>`).join('')+'<p><small>Every report can be filtered, grouped, and exported to CSV, PDF or printed. Instrument inventory has its own tab.</small></p>';}
async function openRep(k){try{if(REPS[k].load)await need(REPS[k].load);}catch(e){return toast(e.message);}ST.rs={id:k,f:{},g:''};render();}
function setF(w,k,v){ST[w].f[k]=v;render();}function setG(w,v){ST[w].g=v;render();}
function repView(w){const st=ST[w],c=core(st),r=c.r,all=r.src();
 const ctl=(r.fl||[]).map(([k,l,t,f,op])=>t==='sel'?`<div><label>${l}</label><select onchange="setF('${w}','${k}',this.value)"><option value="">All</option>${[...new Set(all.map(x=>x[f]).filter(Boolean))].sort().map(v=>`<option ${st.f[k]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`:`<div><label>${l}</label><input type="${t==='date'?'date':'text'}" value="${esc(st.f[k]||'')}" onchange="setF('${w}','${k}',this.value)"></div>`).join('');
 const gsel=r.gr&&r.gr.length?`<div><label>Group by</label><select onchange="setG('${w}',this.value)"><option value="">No grouping</option>${r.gr.map(([k,l])=>`<option value="${k}" ${st.g===k?'selected':''}>${l}</option>`).join('')}</select></div>`:'';
 const sum=c.g?Object.entries(c.rows.reduce((a,x)=>(a[x._g]=(a[x._g]||0)+1,a),{})):[];
 const fs=Object.entries(st.f).filter(([k,v])=>v).map(([k,v])=>k+': '+v).join(', ');
 return`${w==='rs'?'<button class="btn alt noprint" onclick="ST.rs=null;render()">← Reports</button>':''}<h3>${esc(r.t)}</h3>
 <div class="bar noprint">${ctl}${gsel}</div><div class="bar noprint"><button class="btn" onclick="exp('csv','${w}')">⬇ CSV</button><button class="btn" onclick="exp('pdf','${w}')">⬇ PDF</button><button class="btn alt" onclick="exp('print','${w}')">🖨 Print</button><span><small>${c.rows.length} row(s)</small></span></div>
 <div class="ph"><b>${esc(r.t)}</b> — ${new Date().toLocaleString()} — by ${esc(S.user.name)}${fs?'<br>Filters: '+esc(fs):''}${c.g?' · grouped by '+esc(c.cols[0][1]):''}</div>
 ${sum.length?`<div class="sc" style="max-height:200px"><table><tr><th>${esc(c.cols[0][1])}</th><th>Count</th></tr>${sum.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table></div><br>`:''}
 <div class="sc"><table><tr>${c.cols.map(k=>`<th>${esc(k[1])}</th>`).join('')}</tr>${c.rows.map(x=>`<tr ${r.click?`onclick="view('${x.id}')" style="cursor:pointer"`:''}>${c.cols.map(k=>`<td>${esc(k[2]==='d'?fmt(x[k[0]]):x[k[0]])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${c.cols.length}">No records</td></tr>`}</table></div>`;}
function exp(kind,w){const c=core(ST[w]),m=[c.cols.map(k=>k[1]),...c.rows.map(x=>c.cols.map(k=>x[k[0]]??''))],name=c.r.t.replace(/\W+/g,'_')+'_'+iso(T0);
 if(kind==='print')return print();
 if(kind==='csv'){const s=m.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download=name+'.csv';a.click();return;}
 try{const d=new window.jspdf.jsPDF('l','pt','a4');d.setFontSize(12);d.text(c.r.t+'  ('+new Date().toLocaleString()+')',30,28);d.autoTable({head:[m[0]],body:m.slice(1).map(r=>r.map(String)),startY:40,styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:[31,78,120]}});d.save(name+'.pdf');}
 catch(e){toast('PDF library not loaded (offline?). Use Print → Save as PDF.');print();}}
/* ---------- start ---------- */
if(S.token&&Date.now()-lastAct<IDLE)boot();else{S={};render();}
</script></body></html>
